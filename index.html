<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hack in Hills ’26 · Builder Pass</title>
<meta name="description" content="Hack in Hills ’26 Community Builder Pass. 20–21 November · Manali, Himachal Pradesh. Built for the climb.">
<meta property="og:title" content="Hack in Hills ’26 · Builder Pass"><meta property="og:description" content="I’m part of Hack in Hills ’26! Built for the climb. 20–21 November · Manali, Himachal Pradesh.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Mono:wght@500;600&family=Fraunces:ital,opsz,wght@1,9..144,400&family=Inter:wght@400;500;600&family=Manrope:wght@700;800&family=Montserrat:wght@800;900&family=Nunito:wght@600&display=swap">
<style>
:root{--canvas:#fff;--soft:#fafafa;--ink:#000;--charcoal:#525252;--body:#737373;--mute:#a3a3a3;--hair:#e5e5e5;--hair2:#d4d4d4;--focus:rgba(59,130,246,.5);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--canvas);color:var(--ink);font:400 15px/1.45 Inter,ui-sans-serif,system-ui,sans-serif;-webkit-text-size-adjust:100%;overflow:hidden}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
svg.i-brand{width:16px;height:16px;flex:none;fill:currentColor}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
.pill input:focus,.pill input:focus-visible{box-shadow:none;outline:none}
:root{--veil:rgba(255,255,255,.45);--onbg:#000;--onbg-mute:#525252}
[data-bg=ice]{--veil:rgba(255,255,255,.38)}
[data-bg=dusk]{--veil:rgba(4,20,24,.45);--onbg:#fff;--onbg-mute:rgba(255,255,255,.78)}
[data-bg=topo]{--veil:rgba(255,255,255,.5)}
[data-bg=sunrise]{--veil:rgba(255,255,255,.42)}
.bgfx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:#fff}
.bgfx i{position:absolute;inset:-20%;background-size:cover;background-position:center;filter:blur(64px) saturate(1.3);opacity:0;transition:opacity 1.4s ease;animation:drift 30s ease-in-out infinite alternate;will-change:transform}
.bgfx i.on{opacity:1}
.bgfx::after{content:"";position:absolute;inset:0;background:var(--veil);transition:background 1.4s ease}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
@keyframes drift{from{transform:scale(1.06) translate3d(-2%,-1.5%,0) rotate(-2deg)}to{transform:scale(1.2) translate3d(2%,2%,0) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.bgfx i{animation:none}#fx{display:none}}
.side{display:contents}
h1,.meta,.note,.zoom{transition:color .6s}
h1{color:var(--onbg)}.meta,.note,.zoom{color:var(--onbg-mute)!important}
.app{position:relative;z-index:1;height:100dvh;max-width:1120px;margin:0 auto;padding:16px;display:grid;gap:12px;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"head" "stage" "form"}
.head{grid-area:head;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{white-space:nowrap;font:600 20px/1.2 Nunito,ui-rounded,"SF Pro Rounded",system-ui,sans-serif;margin:0}
.meta{color:var(--body);font-size:13px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.stage{grid-area:stage;min-height:0;display:flex;align-items:center;justify-content:center}
#c{display:block;max-width:100%;max-height:100%;width:auto;height:auto;border-radius:12px;border:1px solid rgba(255,255,255,.6);box-shadow:0 24px 70px rgba(0,0,0,.22);touch-action:none;cursor:grab;transition:transform .3s ease}
form{grid-area:form;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center}
.pill{display:flex;align-items:center;gap:10px;min-height:42px;padding:0 6px 0 16px;border:1px solid var(--hair);border-radius:999px;background:var(--canvas);color:var(--body);transition:border-color .15s ease,box-shadow .15s ease}
.pill:focus-within{border-color:var(--ink);box-shadow:0 0 0 3px var(--focus)}
.pill input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:400 16px Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);padding:10px 0}
.pill input::placeholder{color:var(--mute)}
.tags{flex-wrap:wrap;row-gap:6px;padding-block:5px}
.tag{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 12px;border-radius:999px;background:var(--soft);border:1px solid var(--hair);color:var(--ink);font-size:13px;font-weight:500;white-space:nowrap}
.tag button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:999px;background:transparent;color:var(--body);padding:0}
.tag button svg{width:14px;height:14px}
.ibtn{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:999px;background:transparent;color:var(--body);flex:none;transition:background .15s}
.ibtn:hover{background:var(--soft)}
.actions{display:flex;flex-direction:column;gap:8px;width:100%}
.caption-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.caption-actions .btn{width:100%;min-width:0;padding:0 8px;font-size:12.5px;gap:6px}
.caption-actions .btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;font:500 14px Inter,ui-sans-serif,system-ui,sans-serif;white-space:nowrap;user-select:none;transition:all .18s cubic-bezier(.16,1,.3,1)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06)}
.btn:active{transform:translateY(0);box-shadow:none}
.btn.primary{background:var(--ink);color:#fff;border:0;width:100%;font-weight:600}
.btn.primary:active{background:#090909}
.btn.secondary{background:var(--canvas);color:var(--ink);border:1px solid var(--hair2)}
.btn.secondary:hover{background:var(--soft);border-color:var(--ink)}
.btn.secondary.copied{border-color:#10b981!important;color:#059669!important;background:#ecfdf5!important}
.btn.upload{flex:1;min-width:0;justify-content:flex-start;padding-left:16px;background:var(--soft);border:1px solid var(--hair);color:var(--ink)}
.btn.upload span{overflow:hidden;text-overflow:ellipsis}
.swatches{display:flex;gap:6px}
.swatches button{width:34px;height:34px;border-radius:999px;border:1px solid var(--hair);padding:2px;background:var(--canvas);transition:transform .15s}
.swatches button:hover{transform:scale(1.08)}
.swatches button i{display:block;width:100%;height:100%;border-radius:999px;background-size:cover;background-position:center}
.swatches button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.zoom{display:flex;align-items:center;gap:10px;color:var(--body);font-size:13px;padding:0 16px}
.zoom input{flex:1;accent-color:var(--ink)}
.note{margin:2px 0 0;font-size:12px;color:var(--body);text-align:center;min-height:1.4em;transition:color .2s ease}
@media (min-width:860px){
.app{max-width:none;padding:28px;gap:44px;grid-template-columns:minmax(0,calc((100dvh - 56px)*.8)) 400px;grid-template-rows:minmax(0,1fr);grid-template-areas:"stage side";justify-content:center;align-items:center}
.stage{height:100%}
.side{grid-area:side;display:flex;flex-direction:column;gap:22px;padding:28px;background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(24px) saturate(1.4);backdrop-filter:blur(24px) saturate(1.4);border:1px solid rgba(255,255,255,.75);border-radius:20px}
.side h1{color:var(--ink)}.side .meta,.side .note,.side .zoom{color:var(--body)!important}
.head{flex-direction:column;align-items:flex-start;gap:4px}
h1{font-size:30px}
.meta{font-size:14px}
form{gap:10px}
}
@media (max-width:859px){
body{overflow-y:auto;overflow-x:hidden}
.app{height:auto;min-height:100dvh;padding:12px;gap:12px;display:flex;flex-direction:column}
.head{order:1}
.stage{order:2;min-height:440px;max-height:58vh;width:100%}
form{order:3;gap:8px;padding-bottom:16px}
}
@media (max-width:420px){
.ev{display:none}
.caption-actions .btn{font-size:12px;padding:0 8px;gap:4px}
}
@media (max-width:350px){
.caption-actions{grid-template-columns:1fr}
}
</style>
</head><body>

</svg>
<div class="bgfx" aria-hidden="true"><i id="bgA"></i><i id="bgB"></i></div><canvas id="fx" aria-hidden="true"></canvas>
<main class="app">
<aside class="side">
<div class="head"><h1>Builder pass</h1><p class="meta"><span class="ev">Hack in Hills ’26 · </span>Manali · 20–21 Nov</p></div>
<form id="f" autocomplete="off">
<div class="row">
<button type="button" class="btn upload" id="drop"><svg class="i"><use href="#i-img"/></svg><span id="dropT">Upload photo</span></button>
<div class="swatches" id="theme" role="group" aria-label="Background">
<button type="button" data-v="ice" aria-pressed="true" aria-label="Snow" title="Snow"><i style="background-image:url(bg/ice.jpg)"></i></button>
<button type="button" data-v="dusk" aria-pressed="false" aria-label="Dusk" title="Dusk"><i style="background-image:url(bg/dusk.jpg)"></i></button>
<button type="button" data-v="topo" aria-pressed="false" aria-label="Topo" title="Topo"><i style="background-image:url(bg/topo.jpg)"></i></button>
<button type="button" data-v="sunrise" aria-pressed="false" aria-label="Sunrise" title="Sunrise"><i style="background-image:url(bg/sunrise.jpg)"></i></button>
</div>
</div>
<input type="file" id="file" accept="image/*" hidden>
<label class="zoom" id="zoomL" hidden>Zoom<input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
<label class="pill"><svg class="i"><use href="#i-user"/></svg><input id="name" maxlength="26" placeholder="Your name" aria-label="Your name"></label>
<label class="pill"><svg class="i"><use href="#i-cap"/></svg><input id="role" maxlength="48" placeholder="Role or college (optional)" aria-label="Role or college"></label>
<div class="pill tags" id="tagBox"><svg class="i"><use href="#i-hash"/></svg><span id="tagList" style="display:contents"></span><input id="field" maxlength="24" list="fields" placeholder="Your domains (up to 3)" aria-label="Domains, up to 3"></div>
<datalist id="fields">
<option value="AI Builder">
<option value="Full-Stack Builder">
<option value="Design Engineer">
<option value="Vibe Coder">
<option value="Web3 Native">
<option value="Open Source Hacker">
<option value="DevTools">
<option value="FinTech">
<option value="Climate Tech">
<option value="HealthTech">
<option value="Cybersecurity">
</datalist>
<label class="pill"><svg class="i"><use href="#i-quote"/></svg><input id="quote" maxlength="56" aria-label="Your quote (optional)"><button type="button" class="ibtn" id="shuffle" aria-label="Another default quote" title="Another default quote"><svg class="i"><use href="#i-shuffle"/></svg></button></label>
<div class="actions">
<button class="btn primary" type="submit" id="btnDownload"><svg class="i"><use href="#i-down"/></svg>Download pass</button>
<div class="caption-actions">
<button class="btn secondary" id="copyX" type="button" aria-label="Copy X caption"><svg class="i-brand"><use href="#i-brand-x"/></svg><span id="copyXT">Copy X caption</span></button>
<button class="btn secondary" id="copyLi" type="button" aria-label="Copy LinkedIn caption"><svg class="i-brand"><use href="#i-brand-linkedin"/></svg><span id="copyLiT">Copy LinkedIn caption</span></button>
</div>
</div>
<p class="note" id="status" aria-live="polite">Your photo stays on your device.</p>
</form>
</aside>
<div class="stage"><canvas id="c" width="1080" height="1350" aria-label="HIH '26 Builder Pass preview"></canvas></div>
